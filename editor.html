<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAP Pseudocode Interpreter</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script>
        // Inline script to prevent FOUC (Flash of Unstyled Content) / wrong theme
        (function() {
            let savedTheme = 'light';
            try {
                const params = new URLSearchParams(window.location.search);
                savedTheme = params.get('theme') || localStorage.getItem('theme') || 'light';
            } catch (e) {
                console.warn('Theme access error:', e);
            }
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        // Handle BFCache
        window.addEventListener('pageshow', (event) => {
             // Always update from storage to sync state (even if not strictly persisted)
             try {
                 const theme = localStorage.getItem('theme') || 'light';
                 document.documentElement.setAttribute('data-theme', theme);
             } catch (e) {
                 console.warn('Theme access error:', e);
             }
        });
    </script>
</head>
<body>
    <header>
        <a href="index.html" class="home-link">&larr; Home</a>
        <h1>EAP Online Interpreter</h1>
        <button id="theme-toggle">🌙 Dark Mode</button>
    </header>
    <main>
        <div class="container">
            <div class="editor-container">
                <div class="panel-header">
                    <span>Κώδικας Ψευδογλώσσας</span>
                    <select id="example-selector">
                        <option value="" disabled selected>Επιλέξτε Παράδειγμα...</option>
                        <option value="HELLO">Hello World</option>
                        <option value="FIBONACCI">Fibonacci</option>
                        <option value="BUBBLE_SORT">Ταξινόμηση Φυσαλίδας</option>
                        <option value="AVERAGE">Μέσος Όρος</option>
                    </select>
                </div>
                <div class="editor-wrapper">
                    <div id="line-numbers">1</div>
                    <div class="code-area">
                        <pre id="highlighting" aria-hidden="true"><code id="highlighting-content"></code></pre>
                        <textarea id="code-editor" placeholder="Επικολλήστε τον κώδικά σας εδώ..." autocomplete="off" autocorrect="off" autocapitalize="off" data-1p-ignore data-lpignore="true" data-form-type="other" spellcheck="false" ></textarea>
                    </div>
                </div>
                <!-- NEW: autocomplete dropdown -->
                <div id="autocomplete-box" class="autocomplete-box" style="display:none;"></div>
                <!-- NEW: syntax help button -->
               <div class="syntax-help">
               <button id="format-button">🎨 FORMAT (Ctrl+Shift+F)</button>
               <button id="syntax-help-button">Βοήθεια Σύνταξης</button>
               </div>

            </div>

            <div class="controls">
                <button id="run-button">▶ ΕΚΤΕΛΕΣΗ</button>
                <div class="secondary-controls">
				            <button id="load-button">📂 ΦΟΡΤΩΣΗ</button>
                    <button id="save-button">💾 ΑΠΟΘΗΚΕΥΣΗ</button>
                    <button id="clear-button">🗑️ ΚΑΘΑΡΙΣΜΟΣ</button>
                </div>
            </div>
			<! -- NEW: file loading feature --> 
			<input   type="file"   id="file-input"   accept=".eap,.txt"   style="display:none" />

            <div class="resizer" id="drag-handle"></div>

            <div class="output-container">
                <div class="panel-header">Αποτέλεσμα / Terminal</div>
                <div id="terminal-window">
                    <div id="terminal-output"></div>
                    <div id="terminal-input-line" style="display: none;">
                        <span id="terminal-prompt">&gt;</span>
                        <input type="text" id="terminal-input" autocomplete="off" spellcheck="false">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer><p>Ένας custom-made compiler για τον αγαπητό φοιτητή του ΕΑΠ</p></footer>
    <script src="core.v6.js"></script>
    <script src="app.v6.js"></script>
</body>
</html>
